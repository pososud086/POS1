        :root { --bg: #121212; --surface: #1e1e1e; --primary: #E63946; --secondary: #F4A261; --text: #f1faee; }
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
        
        /* Layout */
        .left-panel { flex: 7; display: flex; flex-direction: column; padding: 20px; border-right: 1px solid #333; height: 100vh; box-sizing: border-box;}
        .right-panel { flex: 3; display: flex; flex-direction: column; padding: 20px; background: var(--surface); position: relative; height: 100vh; box-sizing: border-box;}
        
        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h2 { font-size: 1.8em; font-weight: 800; margin: 0; }
        .btn-print-setup { background: #007BFF; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-size: 1.1em; font-weight: bold; transition: 0.3s; }
        .btn-print-setup:hover { background: #0056b3; }
        
        /* Menu Area */
        .menu-list-container { overflow-y: auto; flex-grow: 1; padding-right: 10px; margin-bottom: 20px;}
        .menu-list-container::-webkit-scrollbar { width: 8px; }
        .menu-list-container::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }

        .category-section { margin-bottom: 30px; }
        .category-title { font-size: 1.5em; font-weight: bold; color: var(--secondary); margin-bottom: 15px; border-bottom: 2px solid #333; padding-bottom: 5px; }

        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        .menu-item { background: #2a2a2a; padding: 20px; border-radius: 12px; text-align: center; cursor: pointer; transition: 0.3s; border: 2px solid transparent; }
        .menu-item:hover { border-color: var(--secondary); transform: translateY(-3px); }
        .menu-name { font-size: 1.2em; font-weight: bold; margin-bottom: 10px;}
        .menu-price { color: var(--secondary); font-size: 1.1em; font-weight: bold; }

        /* ระบบปริ้นแต้ม (ตรึงล่างซ้าย) */
        .point-system-container { border-top: 2px dashed #444; padding-top: 15px; background: var(--bg); }
        .point-system-title { font-size: 1.2em; font-weight: bold; margin-bottom: 10px; color: var(--secondary); display: flex; justify-content: space-between; align-items: center;}
        .point-grid { display: flex; overflow-x: auto; gap: 10px; padding-bottom: 10px; }
        .point-grid::-webkit-scrollbar { height: 6px; }
        .point-grid::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
        .cup-btn { background-color: #2a2a2a; border: 2px solid #27ae60; color: #27ae60; font-size: 1.2em; font-weight: bold; padding: 15px 25px; border-radius: 10px; cursor: pointer; transition: 0.2s; white-space: nowrap; flex-shrink: 0;}
        .cup-btn:hover { background-color: #27ae60; color: white; }
        .cup-btn:active { transform: scale(0.95); }

        /* Cart Area */
        .right-panel h2 { font-size: 1.6em; font-weight: bold; margin-top: 0;}
        .cart-list { flex: 1; overflow-y: auto; margin-bottom: 20px; padding-right: 5px;}
        .cart-list::-webkit-scrollbar { width: 6px; }
        .cart-list::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

        .cart-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #444; }
        .cart-item-info { flex: 1; font-size: 1.1em; font-weight: bold;}
        .cart-addon { font-size: 0.85em; color: #bbb; font-weight: normal; margin-top: 4px;}
        .cart-item-price-col { text-align: right; font-size: 1.1em; font-weight: bold;}
        
        .cart-total-section { border-top: 2px dashed #555; padding-top: 15px; }
        .summary-line { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 1.3em; font-weight: bold;}
        
        .btn-main { background: var(--primary); color: white; border: none; padding: 18px; border-radius: 8px; font-size: 1.3em; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s; }
        .btn-main:hover { background: #d62828; }
        .btn-secondary { background: var(--secondary); color: #121212; border: none; padding: 18px; border-radius: 8px; font-size: 1.3em; cursor: pointer; width: 100%; margin-top: 10px; font-weight: bold; }
        .btn-gray { background: #555; color: white; border: none; padding: 18px; border-radius: 8px; font-size: 1.3em; cursor: pointer; width: 100%; margin-top: 10px; font-weight: bold; transition: 0.3s; }
        .btn-gray:hover { background: #777; }
        .btn-delete { background: #dc3545; color: white; border: none; border-radius: 6px; padding: 6px 12px; margin-top: 5px; cursor: pointer; font-weight: bold;}

        /* Modals */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: var(--surface); padding: 30px; border-radius: 15px; width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto; }
        .modal h2 { margin-top: 0; border-bottom: 1px solid #444; padding-bottom: 10px; font-size: 1.6em;}
        .addon-group { margin-bottom: 20px; }
        .addon-group h3 { font-size: 1.3em; color: var(--secondary); margin-bottom: 10px;}
        .addon-option { display: flex; justify-content: space-between; padding: 12px; background: #2a2a2a; margin-bottom: 8px; border-radius: 8px; font-size: 1.1em; font-weight: bold; cursor: pointer;}
        .addon-option label { cursor: pointer; display: flex; align-items: center; width: 100%;}
        .addon-option input[type="checkbox"] { transform: scale(1.3); margin-right: 12px; cursor: pointer;}

        /* Background Task Notification (มุมขวาบน) */
        .bg-task-notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(40, 167, 69, 0.9);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: none;
            z-index: 9999;
            align-items: center;
            gap: 15px;
            animation: slideInRight 0.3s ease-out;
        }
        
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }

        /* ปุ่มกากบาทปิด Modal */
        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text);
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .close-btn:hover {
            background: var(--primary);
            color: white;
            transform: scale(1.1);
        }
        
        /* ปรับ position ของ modal-content เพื่อให้ยึดปุ่ม close-btn ได้ถูกต้อง */
        .modal-content {
            position: relative; /* เพิ่มบรรทัดนี้ หรือถ้ามีอยู่แล้วก็ไม่เป็นไร */
            /* ... โค้ดเดิมของ .modal-content ... */
        }

        /* Background Loading Toast (ทำงานเบื้องหลัง) */
        .toast-container { position: absolute; top: 20px; right: 20px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: rgba(30, 30, 30, 0.9); color: white; padding: 15px 25px; border-left: 5px solid var(--secondary); border-radius: 8px; font-size: 1.1em; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.5); animation: slideIn 0.3s ease, fadeOut 0.5s ease 3s forwards; }
        .toast.success { border-color: #28a745; }
        .toast.error { border-color: #dc3545; animation: slideIn 0.3s ease; /* Error ไม่ปิดเอง */ }
        
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; display: none; } }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideOutRight { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
    </style>

        async function connectBluetooth() {

        function convertCanvasToESCPOS(ctx, width, height) {
            const imgData = ctx.getImageData(0, 0, width, height).data;
            const xL = (width / 8) % 256;
            const xH = Math.floor((width / 8) / 256);
            const yL = height % 256;
            const yH = Math.floor(height / 256);
            let bytes = [0x1B, 0x40, 0x1D, 0x76, 0x30, 0x00, xL, xH, yL, yH];
            
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x += 8) {
                    let byte = 0;
                    for (let b = 0; b < 8; b++) {
                        if (x + b < width) {
                            const i = ((y * width) + (x + b)) * 4;
                            const brightness = (0.299 * imgData[i] + 0.587 * imgData[i+1] + 0.114 * imgData[i+2]);
                            if (imgData[i+3] > 128 && brightness < 128) byte |= (1 << (7 - b));
                        }
                    }
                    bytes.push(byte);
                }
            }
            bytes.push(0x0A, 0x0A, 0x0A, 0x0A); 
            return new Uint8Array(bytes);
        }

            drawText('รายการ', 10, 'left', 'bold 24px sans-serif');
            drawText('ราคา', 374, 'right', 'bold 24px sans-serif'); 
            y += 40;

            let total = 0, discount = 0;
            let printCart = {};
            cart.forEach(item => {
                let itemTotal = item.price;
                let addons = [];
                item.selectedAddons.forEach(a => {
                    itemTotal += a.price;
                    addons.push(a.name);
                });
                if(item.isFree) discount += itemTotal; else total += itemTotal;
                let key = item.name + addons.join('') + (item.isFree ? 'FREE' : '');
                if(!printCart[key]) {
                    printCart[key] = { name: item.name, qty: 0, price: item.isFree ? 0 : itemTotal, addons: addons, isFree: item.isFree };
                }
                printCart[key].qty++;
            });

            for(let key in printCart) {
                const item = printCart[key];
                drawText(`x${item.qty} ${item.name}` + (item.isFree ? ' (ฟรี)' : ''), 10, 'left', 'bold 26px sans-serif');
                drawText(`${item.price * item.qty}฿`, 374, 'right', 'bold 26px sans-serif');
                y += 35;
                item.addons.forEach(addon => {
                    drawText(`+ ${addon}`, 35, 'left', '24px sans-serif');
                    y += 35;
                });
            }

            y += 10;
            drawText('--------------------------------', 192, 'center', 'bold 24px sans-serif');
            y += 40;
            drawText('ส่วนลด', 10, 'left', '26px sans-serif');
            drawText(`${discount}฿`, 374, 'right', '26px sans-serif');
            y += 40;
            drawText('รวม', 10, 'left', 'bold 30px sans-serif');
            drawText(`${total}฿`, 374, 'right', 'bold 30px sans-serif');
            y += 50;

            if (type === 'customer') {
                drawText('ขอบคุณลูกค้าทุกท่านนะคะ', 192, 'center', '26px sans-serif');
                y += 35;
                drawText('Tel : 083-117-8690', 192, 'center', '26px sans-serif');
                y += 60;
            } else { y += 40; }

            try {
                if (type === 'shop') saveOrderAndFinish(); // สั่งบันทึกและปิดหน้าจอเคลียร์ข้อมูลทันที

                showBackgroundTask("กำลังปริ้นใบเสร็จ...");
                const escposData = convertCanvasToESCPOS(ctx, 384, y);
                for (let i = 0; i < escposData.length; i += 100) {
                    await printCharacteristic.writeValue(escposData.slice(i, i + 100));
                }
                hideBackgroundTask();
            } catch (e) {
                hideBackgroundTask("ปริ้นล้มเหลว", true);
            }
        }

        // ==========================================
        // 2. ระบบปริ้นโค้ดสะสมแต้ม
        // ==========================================
        function generatePointButtons() {
            const grid = document.getElementById('point-button-grid');
            for (let i = 1; i <= 10; i++) {
                let btn = document.createElement('button');
                btn.className = 'cup-btn';
                btn.innerText = i + ' แก้ว';
                btn.onclick = () => requestPointPrint(i);
                grid.appendChild(btn);
            }
        }

async function requestPointPrint(cups) {
            if (!printCharacteristic) {
                alert("กรุณาเชื่อมต่อเครื่องปริ้นที่ปุ่มสีน้ำเงินด้านบนก่อนครับ!");
                return;
            }
            
            const loadingToast = showToast(`กำลังตรวจสอบและสร้างโค้ด ${cups} แก้ว... 🍵`);
            
            function generateRandomString(length) {
                const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
                let result = '';
                for (let i = 0; i < length; i++) {
                    result += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                return result;
            }

            // คำนวณวันหมดอายุ +30 วัน (คำนวณครั้งเดียวพอ)
            const expDate = new Date();
            expDate.setDate(expDate.getDate() + 30);
            const dd = ("0" + expDate.getDate()).slice(-2);
            const mm = ("0" + (expDate.getMonth() + 1)).slice(-2); 
            const yyyy = expDate.getFullYear();
            const expiryDate = `${dd}/${mm}/${yyyy}`;

            let isSaved = false;
            let finalCode = "";

            try {
                // ลูปพยายามสร้างและบันทึกโค้ด (จำกัดไม่เกิน 5 รอบเพื่อป้องกันแอพค้างหากเน็ตพัง)
                let attempts = 0;
                while (!isSaved && attempts < 5) {
                    attempts++;
                    
                    // 1. สุ่มรหัสใหม่ 10 หลักแรก + 2 หลักท้าย
                    const random10 = generateRandomString(10);
                    const cupsStr = ("0" + cups).slice(-2);
                    const code = `${random10}${cupsStr}`;
                    
                    const payload = {
                        code: code,
                        cups: cups,
                        expiry_date: expiryDate
                    };

                    // 2. ลองยิงเข้า Supabase (ถ้าคุณตั้ง Unique Constraint ไว้ ถ้าซ้ำมันจะ Error 409)
                    const response = await fetch(`${SUPABASE_URL}/rest/v1/point_codes`, {
                        method: 'POST',
                        headers: {
                            'apikey': SUPABASE_KEY,
                            'Authorization': `Bearer ${SUPABASE_KEY}`,
                            'Content-Type': 'application/json',
                            'Prefer': 'return=minimal' // ไม่ต้องรับ data กลับมา
                        },
                        body: JSON.stringify(payload)
                    });

                    if (response.ok) {
                        // บันทึกสำเร็จ (ไม่ซ้ำ)
                        isSaved = true;
                        finalCode = code;
                    } else if (response.status === 409) {
                        // Status 409 หมายถึง Conflict (ข้อมูลซ้ำ) ระบบจะรันลูป while ใหม่อีกรอบเพื่อสุ่มใหม่
                        console.warn(`โค้ด ${code} ซ้ำ! กำลังสุ่มใหม่...`);
                    } else {
                        // Error อื่นๆ เช่น อินเทอร์เน็ตหลุด, API คีย์ผิด
                        throw new Error(`Supabase Error: ${response.status}`);
                    }
                }

                // ออกจากลูปแล้ว เช็คว่าบันทึกสำเร็จจริงหรือไม่
                if (isSaved) {
                    loadingToast.innerText = `สร้างโค้ดสำเร็จ กำลังปริ้น... 🖨️`;
                    
                    // เรียกฟังก์ชันวาดรูปลงกระดาษ
                    handlePointPrint({
                        code: finalCode,
                        cups: cups,
                        expiryDate: expiryDate 
                    }, loadingToast);
                } else {
                    throw new Error("ไม่สามารถสร้างรหัสที่ไม่ซ้ำได้หลังจากพยายามหลายครั้ง");
                }

            } catch (error) {
                loadingToast.remove();
                showToast(`ล้มเหลว: ${error.message}`, 'error');
            }
        }
        async function handlePointPrint(data) {
            try {
                showBackgroundTask("กำลังปริ้นโค้ดแต้ม...");
                const canvas = document.getElementById('receiptCanvas');
                canvas.height = 800; 
                
                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                ctx.fillStyle = 'white';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'black';
                ctx.textAlign = 'center';
                
                let y = 40;
                ctx.font = 'bold 24px sans-serif';
                ctx.fillText('สมัครสมาชิก LINE เติมมัทฉะ', 192, y);
                y += 30;

                const qrLine = new QRious({ value: 'https://lin.ee/qcDHIwx', size: 150 });
                ctx.drawImage(qrLine.canvas, 192 - 75, y, 150, 150);
                y += 180;

                ctx.font = '22px sans-serif';
                ctx.fillText('สแกน หรือ กรอกโค้ดเพื่อสะสมแต้ม', 192, y);
                y += 40;

                ctx.font = 'bold 28px sans-serif';
                ctx.fillText('จำนวน ' + data.cups + ' แก้ว', 192, y);
                y += 30;

                const qrCode = new QRious({ value: String(data.code), size: 200 });
                ctx.drawImage(qrCode.canvas, 192 - 100, y, 200, 200);
                y += 230; 
                
                ctx.font = 'bold 28px sans-serif';
                ctx.fillText(data.code || "ไม่พบโค้ด", 192, y);
                y += 35;
                
                ctx.font = '20px sans-serif';
                ctx.fillText('โค้ดสะสมแต้มมีอายุ 30 วัน', 192, y);
                y += 30;
                ctx.fillText('(หมดอายุ ' + data.expiryDate + ')', 192, y);
                
                y += 50; 
                ctx.fillText('------------------------------', 192, y);

                const escposData = convertCanvasToESCPOS(ctx, 384, y + 20);
                
                for (let i = 0; i < escposData.length; i += 100) {
                    await printCharacteristic.writeValue(escposData.slice(i, i + 100));
                }
                hideBackgroundTask("ปริ้นสำเร็จ");
            } catch (e) {
                hideBackgroundTask("ปริ้นล้มเหลว", true);
            } 
        }

        // ==========================================
        // 3. UI และ ฟังก์ชัน POS พื้นฐาน
        // ==========================================
        function renderAllMenus() {
            const container = document.getElementById('menu-list-container');
            container.innerHTML = '';
            const cats = [...new Set(appData.menus.map(m => m.category))];

            cats.forEach(cat => {
                const section = document.createElement('div');
                section.className = 'category-section';
                section.innerHTML = `<div class="category-title">${cat}</div>`;
                const grid = document.createElement('div');
                grid.className = 'menu-grid';

                const items = appData.menus.filter(m => m.category === cat);
                items.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'menu-item';
                    div.innerHTML = `<div class="menu-name">${item.name}</div><div class="menu-price">${item.price}฿</div>`;
                    div.onclick = () => selectItem(item);
                    grid.appendChild(div);
                });

                section.appendChild(grid);
                container.appendChild(section);
            });
        }

        function selectItem(item) {
            if (item.addonId && item.addonId.length > 0) {
                tempItem = { ...item, selectedAddons: [] };
                openAddonModal(item);
            } else {
                addToCart({ ...item, selectedAddons: [], cartId: Date.now() });
            }
        }

        function openAddonModal(item) {
            document.getElementById('addon-modal-title').innerText = item.name;
            const body = document.getElementById('addon-modal-body');
            body.innerHTML = '';
            
            item.addonId.forEach(aId => {
                const addon = appData.addons[aId];
                if (addon) {
                    const group = document.createElement('div');
                    group.className = 'addon-group';
                    group.innerHTML = `<h3>${addon.name}</h3>`;
                    addon.options.forEach(opt => {
                        const optDiv = document.createElement('div');
                        optDiv.className = 'addon-option';
                        optDiv.innerHTML = `
                            <label><input type="checkbox" value='${JSON.stringify(opt)}' class="addon-chk"> <span>${opt.name}</span></label>
                            <span>+${opt.price}฿</span>
                        `;
                        optDiv.onclick = function(e) {
                            if(e.target.tagName !== 'INPUT') {
                                const chk = this.querySelector('input');
                                chk.checked = !chk.checked;
                            }
                        };
                        group.appendChild(optDiv);
                    });
                    body.appendChild(group);
                }
            });
            document.getElementById('addon-modal').style.display = 'flex';
        }

        function confirmAddon() {
            const checkboxes = document.querySelectorAll('.addon-chk:checked');
            checkboxes.forEach(chk => { tempItem.selectedAddons.push(JSON.parse(chk.value)); });
            tempItem.cartId = Date.now();
            addToCart(tempItem);
            closeModal('addon-modal');
        }

        function addToCart(item) {
            item.isFree = false;
            cart.push(item);
            renderCart();
        }

        function renderCart() {
            const list = document.getElementById('cart-list');
            list.innerHTML = '';
            let total = 0, discount = 0;

            cart.forEach((item, index) => {
                let itemTotal = item.price;
                let addonText = '';
                item.selectedAddons.forEach(a => {
                    itemTotal += a.price;
                    addonText += `+ ${a.name} `;
                });

                if(item.isFree) discount += itemTotal; else total += itemTotal;

                list.innerHTML += `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <div>${item.name} ${item.isFree ? '<span style="color:#E63946">(ฟรี)</span>' : ''}</div>
                            <div class="cart-addon">${addonText}</div>
                        </div>
                        <div class="cart-item-price-col">
                            <div>${item.isFree ? '0' : itemTotal}฿</div>
                            <button class="btn-delete" onclick="cart.splice(${index}, 1); renderCart();">ลบ</button>
                        </div>
                    </div>
                `;
            });

            document.getElementById('discount-display').innerText = discount + '฿';
            document.getElementById('total-display').innerText = total + '฿';
            updateCustomerDisplay(total, discount);
        }

        function openFreeCupModal() {
            if(cart.length === 0) return alert('กรุณาเลือกสินค้าก่อน');
            const body = document.getElementById('free-modal-body');
            body.innerHTML = '';
            cart.forEach((item, i) => {
                body.innerHTML += `
                    <div class="addon-option" onclick="const chk=document.getElementById('free-chk-${i}'); chk.checked=!chk.checked;">
                        <label onclick="event.preventDefault()">
                            <input type="checkbox" id="free-chk-${i}" ${item.isFree ? 'checked' : ''} onclick="event.stopPropagation()"> 
                            <span>${item.name}</span>
                        </label>
                    </div>
                `;
            });
            document.getElementById('free-modal').style.display = 'flex';
        }

        function confirmFree() {
            cart.forEach((item, i) => { item.isFree = document.getElementById(`free-chk-${i}`).checked; });
            renderCart();
            closeModal('free-modal');
            openPaymentModal();
        }

        function skipFree() {
            cart.forEach(item => item.isFree = false);
            renderCart();
            closeModal('free-modal');
            openPaymentModal();
        }

        function openPaymentModal() {
            document.getElementById('pay-amount').innerText = document.getElementById('total-display').innerText;
            document.getElementById('print-controls').style.display = 'none';
            document.getElementById('payment-modal').style.display = 'flex';
            
            let state = JSON.parse(localStorage.getItem('pos_state')) || { cart:[], total:0, discount:0 };
            state.showQR = false;
            localStorage.setItem('pos_state', JSON.stringify(state));
        }

        function processPayment(method) {
            currentPaymentMethod = method;
            document.getElementById('print-controls').style.display = 'block';
            
            if (method === 'QRCODE') {
                let state = JSON.parse(localStorage.getItem('pos_state'));
                state.showQR = true;
                localStorage.setItem('pos_state', JSON.stringify(state));
            }
        }

async function saveOrderAndFinish() {
            let total = 0;
            cart.forEach(item => {
                let itemTotal = item.price;
                item.selectedAddons.forEach(a => itemTotal += a.price);
                if(!item.isFree) total += itemTotal;
            });

            const savedOrderId = currentOrderId;
            
            // สร้างวันที่รูปแบบ dd/mm/yyyy
            const d = new Date();
            const dateStr = `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;

            // รูปแบบข้อมูลที่ตรงกับตาราง pos_orders ใน Supabase
            const payload = { 
                order_id: savedOrderId, 
                date_str: dateStr, 
                total: total, 
                payment_method: currentPaymentMethod 
            };

            // 1. เคลียร์ตะกร้า ปิดหน้าต่าง เตรียมรับลูกค้าคนต่อไปทันที
            currentOrderId++;
            cart = [];
            renderCart();
            closeModal('payment-modal');

            // 2. แสดง Toast
            const loadingToast = showToast(`กำลังบันทึกออเดอร์ #${savedOrderId}...`);

            // 3. ยิงข้อมูลเข้า Supabase โดยตรง (เสร็จในหลักมิลลิวินาที)
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/pos_orders`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal' // บอกให้ Supabase บันทึกเสร็จแล้วไม่ต้องส่งข้อมูลกลับมา (ประหยัดเน็ต)
                    },
                    body: JSON.stringify(payload)
                });
                
                if (!response.ok) throw new Error('Network Error');

                loadingToast.className = 'toast success';
                loadingToast.innerText = `บันทึกออเดอร์ #${savedOrderId} สำเร็จ ✅`;
                setTimeout(() => { if(loadingToast.parentElement) loadingToast.remove(); }, 3000);
            } catch (err) {
                loadingToast.remove();
                showToast(`บันทึกออเดอร์ #${savedOrderId} ล้มเหลว!`, 'error');
            }
        }

        function updateCustomerDisplay(total = 0, discount = 0) {
            const state = { cart, total, discount, showQR: false };
            localStorage.setItem('pos_state', JSON.stringify(state));
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    </script>
</body>
