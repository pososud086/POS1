<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>POS System - ร้านเติมมัทฉะ</title>
  <style>
    :root { --bg: #121212; --panel: #1e1e1e; --primary: #d32f2f; --accent: #ff9800; --text: #ffffff; }
    body { margin: 0; font-family: 'Sarabun', sans-serif; background-color: var(--bg); color: var(--text); user-select: none; }
    .header { background-color: var(--primary); padding: 15px; text-align: center; font-size: 24px; font-weight: bold; }
    .layout { display: grid; grid-template-columns: 2fr 1fr; height: calc(100vh - 60px); }
    .menu-area { padding: 15px; overflow-y: auto; }
    .cart-area { background-color: var(--panel); padding: 15px; display: flex; flex-direction: column; }
    
    .cat-btn, .menu-btn { background-color: #333; border: 1px solid #444; color: white; padding: 20px; font-size: 18px; border-radius: 8px; cursor: pointer; text-align: center; }
    .cat-btn.active { background-color: var(--accent); color: black; font-weight: bold; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; margin-bottom: 20px; }
    
    .cart-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #333; }
    .btn-large { background-color: var(--primary); color: white; border: none; padding: 20px; font-size: 22px; width: 100%; border-radius: 8px; cursor: pointer; margin-top: auto; }
    .btn-large.orange { background-color: var(--accent); color: black; }
    
    /* Modal */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
    .modal-content { background: var(--panel); padding: 30px; border-radius: 12px; width: 90%; max-width: 500px; text-align: center; }
    .modal-btn { padding: 15px 30px; font-size: 20px; margin: 10px; border-radius: 8px; border: none; cursor: pointer; }

    /* เพิ่มปุ่มตั้งค่าและฟอร์ม */
.setting-btn { background: none; border: none; color: white; font-size: 28px; cursor: pointer; float: right; margin-top: -4px; }
.settings-section { background: #2a2a2a; padding: 15px; margin-bottom: 15px; border-radius: 8px; text-align: left; }
.settings-section h3 { margin-top: 0; color: var(--accent); border-bottom: 1px solid #444; padding-bottom: 5px; }
.input-group { margin-bottom: 10px; }
.input-group label { display: block; margin-bottom: 5px; font-size: 14px; color: #ccc; }
.input-field { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #444; background: #121212; color: white; font-size: 16px; box-sizing: border-box; }
.save-btn { background-color: #4CAF50; color: white; border: none; padding: 10px 15px; border-radius: 6px; font-size: 16px; cursor: pointer; width: 100%; margin-top: 5px;}
    
    canvas { display: none; } /* ซ่อน Canvas สำหรับปริ้น */
  </style>
</head>
<body>
  <!-- เปลี่ยน Header เดิมเป็นแบบนี้ -->
  <div class="header" id="shop-header">
    POS ร้านเติมมัทฉะ
    <button class="setting-btn" onclick="openSettings()">⚙️</button>
  </div>

  <!-- หน้าต่างตั้งค่า (Settings Modal) -->
  <div class="modal" id="settings-modal" style="display:none; align-items:flex-start; padding-top:20px; overflow-y:auto;">
    <div class="modal-content" style="width: 95%; max-width: 600px; text-align: left;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h2 style="margin: 0; color: var(--primary);">⚙️ ตั้งค่าร้านค้า</h2>
        <button onclick="closeSettings()" style="background:red; color:white; border:none; padding:10px 15px; border-radius:6px; cursor:pointer;">ปิด (X)</button>
      </div>

      <!-- 1. ตั้งค่าร้านและปริ้นเตอร์ -->
      <div class="settings-section">
        <h3>1. ตั้งค่าระบบทั่วไป</h3>
        <div class="input-group">
          <label>URL โลโก้ร้าน:</label>
          <input type="text" id="set-logo" class="input-field" placeholder="https://...">
        </div>
        <div class="input-group">
          <label>เครื่องปริ้นเริ่มต้น:</label>
          <select id="set-printer" class="input-field">
            <option value="Bluetooth">Bluetooth (มือถือ/แท็บเล็ต)</option>
            <option value="USB">USB (คอมพิวเตอร์)</option>
          </select>
        </div>
        <button class="save-btn" onclick="saveGeneralSettings()">บันทึกการตั้งค่าทั่วไป</button>
      </div>

      <!-- 2. หมวดหมู่ -->
      <div class="settings-section">
        <h3>2. สร้างหมวดหมู่เมนู</h3>
        <div class="input-group">
          <label>ชื่อหมวดหมู่ (เช่น กาแฟ, ชาเขียว):</label>
          <input type="text" id="set-cat-name" class="input-field">
        </div>
        <button class="save-btn" onclick="saveCategory()">+ เพิ่มหมวดหมู่</button>
      </div>

      <!-- 3. เมนู -->
      <div class="settings-section">
        <h3>3. สร้างเมนูใหม่</h3>
        <div class="input-group">
          <label>เลือกหมวดหมู่:</label>
          <select id="set-menu-cat" class="input-field"></select>
        </div>
        <div class="input-group">
          <label>ชื่อเมนู:</label>
          <input type="text" id="set-menu-name" class="input-field">
        </div>
        <div class="input-group">
          <label>ราคา (บาท):</label>
          <input type="number" id="set-menu-price" class="input-field">
        </div>
        <div class="input-group" style="display: flex; align-items: center; gap: 10px;">
          <input type="checkbox" id="set-menu-acc" style="width: 25px; height: 25px;">
          <label style="margin: 0;">นับสะสมจำนวนแก้ว (10 แถม 1)</label>
        </div>
        <button class="save-btn" onclick="saveMenu()" style="margin-top: 15px;">+ เพิ่มเมนู</button>
      </div>

      <!-- 4. ตัวเลือกเสริม (Add-on) -->
      <div class="settings-section">
        <h3>4. สร้างตัวเลือกเสริม (Topping/ความหวาน)</h3>
        <div class="input-group">
          <label>ผูกกับเมนู:</label>
          <select id="set-addon-menu" class="input-field"></select>
        </div>
        <div class="input-group">
          <label>ชื่อตัวเลือก (เช่น หวานน้อย, ไข่มุก):</label>
          <input type="text" id="set-addon-name" class="input-field">
        </div>
        <div class="input-group">
          <label>ราคาบวกเพิ่ม (บาท, หากฟรีให้ใส่ 0):</label>
          <input type="number" id="set-addon-price" class="input-field" value="0">
        </div>
        <div class="input-group">
          <label>รูปแบบการเลือก:</label>
          <select id="set-addon-type" class="input-field">
            <option value="Single">เลือกได้แค่ 1 อย่าง (Radio)</option>
            <option value="Multiple">เลือกได้หลายอย่าง (Checkbox)</option>
          </select>
        </div>
        <div class="input-group" style="display: flex; align-items: center; gap: 10px;">
          <input type="checkbox" id="set-addon-req" style="width: 25px; height: 25px;">
          <label style="margin: 0;">บังคับเลือก (จำเป็นต้องเลือกก่อนชำระเงิน)</label>
        </div>
        <button class="save-btn" onclick="saveAddon()" style="margin-top: 15px;">+ เพิ่มตัวเลือกเสริม</button>
      </div>

    </div>
  </div>
  
  <div class="layout">
    <div class="menu-area">
      <div class="grid" id="category-list"></div>
      <div class="grid" id="menu-list"></div>
    </div>
    
    <div class="cart-area">
      <h2 style="margin-top:0">รายการสั่งซื้อ</h2>
      <div id="cart-items" style="flex:1; overflow-y:auto;"></div>
      <div style="font-size: 24px; font-weight: bold; margin: 15px 0;">รวม: <span id="total-price">0</span> บาท</div>
      <button class="btn-large" onclick="checkoutStep1()">ถัดไป (Next)</button>
    </div>
  </div>

  <!-- ขั้นตอนการชำระเงิน Modal -->
  <div class="modal" id="checkout-modal">
    <div class="modal-content">
      <h2>เลือกรายการแถม (ฟรี)</h2>
      <div id="free-cup-section">
        <button class="modal-btn orange" onclick="promptMember()">แถมแก้วฟรี (สแกนสมาชิก)</button>
        <button class="modal-btn" style="background:#555; color:white;" onclick="selectPayment()">ไม่มี / ข้าม</button>
      </div>
      
      <div id="payment-section" style="display:none;">
        <h2>วิธีชำระเงิน</h2>
        <button class="modal-btn orange" onclick="completeOrder('Cash')">เงินสด (Cash)</button>
        <button class="modal-btn" style="background:#4CAF50; color:white;" onclick="completeOrder('QR')">QR-CODE</button>
      </div>
    </div>
  </div>

  <!-- Canvas สำหรับปริ้นใบเสร็จ -->
  <canvas id="receiptCanvas"></canvas>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
