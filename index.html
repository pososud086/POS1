<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Touchscreen POS</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
  <div class="navbar">
    <div class="logo-container">
      <img id="store-logo" src="" alt="Store Logo">
      <span id="store-title" style="font-size: 1.4rem; font-weight: bold; margin-left: 10px;">POS Café</span>
    </div>
    <div>
      <button class="btn-touch btn-warning" onclick="switchView('pos')">หน้าร้าน</button>
      <button class="btn-touch btn-primary" onclick="switchView('expense')">รายจ่าย</button>
      <button class="btn-touch btn-warning" onclick="switchView('dashboard')">แดชบอร์ด</button>
      <button class="btn-touch" style="background:#444;" onclick="openSettingsModal()">⚙️</button>
    </div>
  </div>

  <!-- หน้าจอ POS หลัก -->
  <div id="view-pos" class="pos-container">
    <div class="menu-section">
      <div id="category-bar" class="category-bar"></div>
      <div id="menu-grid" class="menu-grid"></div>
    </div>

    <div class="cart-section">
      <h2>รายการสั่งซื้อ</h2>
      <div id="cart-items" class="cart-items"></div>
      <div style="border-top: 1px solid #444; padding-top: 10px;">
        <h3>รวมทั้งสิ้น: <span id="cart-total" style="color: var(--accent-orange);">0</span> บาท</h3>
        <button class="btn-touch btn-primary" style="width: 100%;" onclick="openCheckoutModal()">ถัดไป ➔</button>
      </div>
    </div>
  </div>

  <!-- Modal ชำระเงิน & แถมแก้วฟรี -->
  <div id="modal-checkout" class="modal-overlay" style="display:none;">
    <div class="modal-content">
      <h2>สิทธิ์แก้วฟรี & การชำระเงิน</h2>
      
      <!-- ขั้นที่ 1: สิทธิ์แก้วฟรี -->
      <div>
        <p>1. สิทธิ์แก้วฟรี</p>
        <button class="btn-touch btn-warning" onclick="selectFreeCupOption('use')">แถมแก้วฟรี</button>
        <button class="btn-touch" style="background:#555;" onclick="selectFreeCupOption('none')">ไม่มี</button>
      </div>

      <!-- ขั้นที่ 2: วิธีชำระเงิน (กดได้เมื่อเลือกสิทธิ์แล้ว) -->
      <div id="payment-section" style="opacity: 0.4; pointer-events: none; margin-top: 20px;">
        <p>2. วิธีชำระเงิน</p>
        <button class="btn-touch btn-primary" onclick="selectPaymentMethod('CASH')">เงินสด</button>
        <button class="btn-touch btn-warning" onclick="selectPaymentMethod('QR-CODE')">QR-CODE</button>
      </div>

      <div style="margin-top: 25px; text-align: right;">
        <button class="btn-touch btn-primary" id="btn-confirm-pay" style="display:none;" onclick="processPaymentAndPrint()">ยืนยันการชำระเงิน (ถัดไป)</button>
        <button class="btn-touch" style="background:#333;" onclick="closeCheckoutModal()">ยกเลิก</button>
      </div>
    </div>
  </div>

  <!-- Modal Numpad กรอกเบอร์โทร -->
  <div id="modal-numpad" class="modal-overlay" style="display:none;">
    <div class="modal-content">
      <h3>กรอกเบอร์โทรสมาชิก</h3>
      <input type="text" id="phone-input" style="width:100%; font-size:1.8rem; text-align:center;" readonly>
      <div class="numpad-grid">
        <button class="btn-touch" onclick="pressNumpad('1')">1</button>
        <button class="btn-touch" onclick="pressNumpad('2')">2</button>
        <button class="btn-touch" onclick="pressNumpad('3')">3</button>
        <button class="btn-touch" onclick="pressNumpad('4')">4</button>
        <button class="btn-touch" onclick="pressNumpad('5')">5</button>
        <button class="btn-touch" onclick="pressNumpad('6')">6</button>
        <button class="btn-touch" onclick="pressNumpad('7')">7</button>
        <button class="btn-touch" onclick="pressNumpad('8')">8</button>
        <button class="btn-touch" onclick="pressNumpad('9')">9</button>
        <button class="btn-touch btn-primary" onclick="clearNumpad()">C</button>
        <button class="btn-touch" onclick="pressNumpad('0')">0</button>
        <button class="btn-touch btn-warning" onclick="submitPhoneCheck()">ตกลง</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
