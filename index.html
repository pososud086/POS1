<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS System - พนักงาน</title>
    <!-- นำเข้าไลบรารีสำหรับสร้าง QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <style>
        :root { --bg: #121212; --surface: #1e1e1e; --primary: #E63946; --secondary: #F4A261; --text: #f1faee; }
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; position: relative; }
        
        /* Layout */
        .left-panel { flex: 7; display: flex; flex-direction: column; padding: 20px; border-right: 1px solid #333; height: 100vh; box-sizing: border-box;}
        .right-panel { flex: 3; display: flex; flex-direction: column; padding: 20px; background: var(--surface); position: relative; height: 100vh; box-sizing: border-box;}
        
        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h2 { font-size: 1.8em; font-weight: 800; margin: 0; }
        .btn-print-setup { background: #007BFF; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-size: 1.1em; font-weight: bold; transition: 0.3s; }
        .btn-print-setup:hover { background: #0056b3; }
        
        /* Background Loading Toast */
        .toast-container { position: absolute; top: 20px; right: 20px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: rgba(30, 30, 30, 0.9); color: white; padding: 15px 25px; border-left: 5px solid var(--secondary); border-radius: 8px; font-size: 1.1em; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.5); animation: slideIn 0.3s ease, fadeOut 0.5s ease 3s forwards; }
        .toast.success { border-color: #28a745; }
        .toast.error { border-color: #dc3545; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; display: none; } }

        /* Menu Area (ยุบขยายหมวดหมู่) */
        .menu-list-container { overflow-y: auto; flex-grow: 1; padding-right: 10px; margin-bottom: 20px;}
        .menu-list-container::-webkit-scrollbar { width: 8px; }
        .menu-list-container::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }

        .category-section { margin-bottom: 15px; background: #1a1a1a; border-radius: 12px; overflow: hidden; border: 1px solid #333; }
        .category-title { font-size: 1.5em; font-weight: bold; color: var(--secondary); padding: 15px 20px; background: #222; cursor: pointer; display: flex; justify-content: space-between; align-items: center; user-select: none; transition: background 0.3s; }
        .category-title:hover { background: #2a2a2a; }
        .category-title::after { content: '▼'; font-size: 0.7em; transition: transform 0.3s ease; color: #888; }
        .category-section.collapsed .category-title::after { transform: rotate(-90deg); }
        .category-content { padding: 20px; display: block; }
        .category-section.collapsed .category-content { display: none; }

        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        .menu-item { background: #2a2a2a; padding: 20px; border-radius: 12px; text-align: center; cursor: pointer; transition: 0.3s; border: 2px solid transparent; }
        .menu-item:hover { border-color: var(--secondary); transform: translateY(-3px); }
        .menu-name { font-size: 1.2em; font-weight: bold; margin-bottom: 10px;}
        .menu-price { color: var(--secondary); font-size: 1.1em; font-weight: bold; }

        /* ระบบปริ้นแต้ม (ตรึงล่างซ้าย) */
        .point-system-container { border-top: 2px dashed #444; padding-top: 15px; background: var(--bg); }
        .point-system-title { font-size: 1.2em; font-weight: bold; margin-bottom: 10px; color: var(--secondary); display: flex; justify-content: space-between; align-items: center;}
        .point-grid { display: flex; overflow-x: auto; gap: 10px; padding-bottom: 10px; }
        .point-grid::-webkit-scrollbar { height: 6px; }
        .point-grid::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
        .cup-btn { background-color: #2a2a2a; border: 2px solid #27ae60; color: #27ae60; font-size: 1.2em; font-weight: bold; padding: 15px 25px; border-radius: 10px; cursor: pointer; transition: 0.2s; white-space: nowrap; flex-shrink: 0;}
        .cup-btn:hover { background-color: #27ae60; color: white; }
        .cup-btn:active { transform: scale(0.95); }

        /* Cart Area */
        .cart-list { flex: 1; overflow-y: auto; margin-bottom: 20px; padding-right: 5px;}
        .cart-list::-webkit-scrollbar { width: 6px; }
        .cart-list::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

        .cart-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #444; }
        .cart-item-info { flex: 1; font-size: 1.1em; font-weight: bold;}
        .cart-addon { font-size: 0.85em; color: #bbb; font-weight: normal; margin-top: 4px;}
        .cart-item-price-col { text-align: right; font-size: 1.1em; font-weight: bold;}
        
        .cart-total-section { border-top: 2px dashed #555; padding-top: 15px; }
        .summary-line { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 1.3em; font-weight: bold;}
        
        .btn-main { background: var(--primary); color: white; border: none; padding: 18px; border-radius: 8px; font-size: 1.3em; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s; }
        .btn-main:hover { background: #d62828; }
        .btn-secondary { background: var(--secondary); color: #121212; border: none; padding: 18px; border-radius: 8px; font-size: 1.3em; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; transition: 0.3s; }
        .btn-warning { background: #f39c12; color: white; border: none; padding: 18px; border-radius: 8px; font-size: 1.3em; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s; }
        .btn-warning:hover { background: #e67e22; }
        .btn-gray { background: #555; color: white; border: none; padding: 18px; border-radius: 8px; font-size: 1.3em; cursor: pointer; width: 100%; margin-top: 10px; font-weight: bold; transition: 0.3s; }
        .btn-gray:hover { background: #777; }
        .btn-delete { background: #dc3545; color: white; border: none; border-radius: 6px; padding: 6px 12px; margin-top: 5px; cursor: pointer; font-weight: bold;}

        /* Modals & Addons */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: var(--surface); padding: 30px; border-radius: 15px; width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto; position: relative; }
        .modal h2 { margin-top: 0; border-bottom: 1px solid #444; padding-bottom: 15px; font-size: 1.6em;}
        
        .close-btn { position: absolute; top: 15px; right: 20px; background: rgba(255, 255, 255, 0.1); color: var(--text); border: none; width: 35px; height: 35px; border-radius: 50%; font-size: 1.2em; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .close-btn:hover { background: var(--primary); color: white; transform: scale(1.1); }

        .addon-group { margin-bottom: 15px; background: #222; border-radius: 10px; overflow: hidden; border: 1px solid #333; }
        .addon-group-header { background: #333; padding: 15px 20px; font-size: 1.3em; color: var(--secondary); font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; align-items: center; user-select: none; transition: background 0.3s; }
        .addon-group-header:hover { background: #444; }
        .addon-group-header::after { content: '▼'; font-size: 0.8em; transition: transform 0.3s ease; }
        .addon-group.collapsed .addon-group-header::after { transform: rotate(-90deg); }
        .addon-group-content { padding: 10px; display: block; }
        .addon-group.collapsed .addon-group-content { display: none; }
        
        .addon-option { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #2a2a2a; margin-bottom: 8px; border-radius: 8px; font-size: 1.2em; font-weight: bold; cursor: pointer; transition: 0.2s; width: 100%; box-sizing: border-box; }
        .addon-option:hover { background: #3a3a3a; }
        .addon-option input[type="checkbox"] { transform: scale(1.5); margin-right: 15px; cursor: pointer; }

        /* ปุ่มลัดปริ้นแต้มในหน้า Payment */
        .payment-point-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 15px 0; padding: 10px; background: #2a2a2a; border-radius: 10px; border: 1px solid #444; }
        .payment-point-btn { background-color: #333; border: 2px solid #27ae60; color: #27ae60; font-size: 1.1em; font-weight: bold; padding: 8px 0; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .payment-point-btn:hover { background-color: #27ae60; color: white; }
        .payment-point-title { grid-column: span 5; text-align: left; font-size: 0.9em; color: var(--secondary); margin-bottom: 5px; }

        /* บิลที่พักไว้ (Held Orders) */
        .held-order-item { background: #2a2a2a; padding: 15px; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #f39c12; }
        .held-order-info { flex: 1; text-align: left; }
        .held-order-actions { display: flex; gap: 5px; }
    </style>
</head>
<body>

    <div class="toast-container" id="toast-container"></div>

    <div class="left-panel">
        <div class="header">
            <h2>POS System</h2>
            <button class="btn-print-setup" id="btn-bt-connect" onclick="connectBluetooth()">🔵 เชื่อมต่อเครื่องปริ้น</button>
        </div>
        
        <div class="menu-list-container" id="menu-list-container">
            <h3 style="text-align: center; color: #888;">กำลังโหลดข้อมูล...</h3>
        </div>

        <div class="point-system-container">
            <div class="point-system-title">
                <span>ปริ้นโค้ดสะสมแต้ม</span>
            </div>
            <div class="point-grid" id="point-button-grid"></div>
        </div>
    </div>

    <div class="right-panel">
        <!-- ส่วนหัวของตระกร้า -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h2 style="margin: 0;">รายการที่เลือก</h2>
            <button class="btn-secondary" style="margin: 0; padding: 8px 12px; font-size: 1em; width: auto;" onclick="openHeldOrdersModal()">📋 บิลที่พัก <span id="held-count">(0)</span></button>
        </div>

        <div class="cart-list" id="cart-list"></div>
        
        <div class="cart-total-section">
            <div class="summary-line"><span>ส่วนลด</span><span id="discount-display">0฿</span></div>
            <div class="summary-line" style="font-weight: bold; color: var(--secondary); font-size: 1.5em;"><span>รวมทั้งหมด</span><span id="total-display">0฿</span></div>
            
            <div style="display: flex; gap: 10px;">
                <button class="btn-warning" onclick="holdOrder()" style="flex: 1;">⏸️ พักบิล</button>
                <button class="btn-main" onclick="openFreeCupModal()" style="flex: 2;">ถัดไป ➔</button>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div class="modal" id="addon-modal">
        <div class="modal-content">
            <h2 id="addon-modal-title">เลือก แอดออน</h2>
            <div id="addon-modal-body"></div>
            <div style="display: flex; gap: 10px; margin-top: 25px;">
                <button class="btn-main" style="background:#555;" onclick="closeModal('addon-modal')">ยกเลิก</button>
                <button class="btn-main" onclick="confirmAddon()">ตกลง</button>
            </div>
        </div>
    </div>

    <div class="modal" id="free-modal">
        <div class="modal-content">
            <h2>เลือกแก้วฟรี (ส่วนลด)</h2>
            <div id="free-modal-body"></div>
            <div style="display: flex; gap: 10px; margin-top: 25px;">
                <button class="btn-main" style="background:#555;" onclick="skipFree()">ข้าม / ไม่เลือก</button>
                <button class="btn-main" onclick="confirmFree()">ยืนยัน</button>
            </div>
        </div>
    </div>

    <div class="modal" id="held-orders-modal">
        <div class="modal-content" style="position: relative;">
            <button class="close-btn" onclick="closeModal('held-orders-modal')">✖</button>
            <h2>📋 บิลที่พักไว้</h2>
            <div id="held-orders-list" style="margin-top: 15px;"></div>
        </div>
    </div>

    <div class="modal" id="payment-modal">
        <div class="modal-content" style="text-align: center; position: relative;">
            <button class="close-btn" onclick="closePaymentModal()">✖</button>
            <h2 style="font-size: 1.8em; margin-top: 10px;">ชำระเงิน <span id="pay-amount" style="color: var(--secondary);"></span></h2>
            <button class="btn-main" style="margin-bottom: 15px;" onclick="processPayment('เงินสด')">💵 เงินสด</button>
            <button class="btn-secondary" onclick="processPayment('QRCODE')">📱 QR Code (โชว์จอลูกค้า)</button>
            
            <div id="print-controls" style="display: none; margin-top: 20px; border-top: 1px solid #444; padding-top: 15px;">
                <!-- แผงปุ่มปริ้นแต้มด่วน -->
                <div class="payment-point-grid" id="payment-point-grid">
                    <div class="payment-point-title">ปริ้นโค้ดแต้มด่วน:</div>
                </div>
                <button class="btn-secondary" onclick="printReceiptBluetooth('customer')" style="margin-bottom:15px;">🖨️ ปริ้นใบเสร็จลูกค้า</button>
                <button class="btn-main" onclick="printReceiptBluetooth('shop')" style="margin-bottom:15px;">🖨️ ปริ้นใบเสร็จร้านค้า & จบออเดอร์</button>
                <button class="btn-gray" onclick="saveOrderAndFinish()">✅ จบออเดอร์ (บันทึกอย่างเดียว)</button>
            </div>
        </div>
    </div>

    <!-- Canvas กลาง -->
    <canvas id="receiptCanvas" width="384" style="display:none;"></canvas>

    <script>
        // ==========================================
        // URL สำหรับ API ต่างๆ (⚠️ แก้ไข URL ตรงนี้ ⚠️)
        // ==========================================
        const POS_API_URL = 'https://script.google.com/macros/s/AKfycbyTsblHupSi2rU2Ue4kXRRpaH-_EfncjOM2bLt41B3fKOnJOCjnyeinaGoSMo5h9VSsXQ/exec';
        const SUPABASE_URL = 'https://lcdukrjagsxqthkrfpqz.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxjZHVrcmphZ3N4cXRoa3JmcHF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2NTY2MDYsImV4cCI6MjEwNTIzMjYwNn0.PVgZhElg7aw3Z2Zb9f2auGcXZ6xtGRIALewIAyZ-IZg';

        let appData = { menus: [], addons: {}, lastOrderId: 0 };
        let cart = [];
        let tempItem = null;
        let currentOrderId = 1;
        let currentPaymentMethod = '';
        let printDevice = null;
        let printCharacteristic = null;
        let heldOrders = JSON.parse(localStorage.getItem('heldOrders')) || [];

        // ฟังก์ชันเริ่มการทำงานของหน้าเว็บ
        window.onload = async () => {
            try {
                // ต้องสร้างปุ่มแต้มก่อน แล้วค่อยอัปเดตเลขบิลพัก
                generatePointButtons();
                if(document.getElementById('held-count')) {
                    updateHeldOrdersCount(); 
                }

                // โหลดข้อมูลเมนู
                const res = await fetch(`${POS_API_URL}?action=getInitData`);
                appData = await res.json();
                currentOrderId = appData.lastOrderId + 1;
                renderAllMenus();
                updateCustomerDisplay();
            } catch (err) {
                console.error(err);
                document.getElementById('menu-list-container').innerHTML = `<h3 style="color:#E63946; text-align:center;">เกิดข้อผิดพลาดในการโหลดข้อมูลเมนู<br><br><span style="font-size:0.7em">${err.message}</span></h3>`;
            }
        };

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            if (!container) return { remove: () => {}, innerText: '' };
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerText = message;
            if(type === 'error') {
                toast.innerHTML += ' <span style="cursor:pointer; float:right; margin-left: 10px;" onclick="this.parentElement.remove()">✖</span>';
                toast.style.animation = 'slideIn 0.3s ease';
            } else {
                setTimeout(() => { if(toast.parentElement) toast.remove(); }, 3500);
            }
            container.appendChild(toast);
            return toast;
        }

        // ==========================================
        // ระบบ BLUETOOTH PRINTER (Auto-Reconnect)
        // ==========================================
        async function connectBluetooth() {
            try {
                printDevice = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb', 'e7810a71-73ae-499d-8c15-faa9aef0c3f2', '49535343-fe7d-4ae5-8fa9-9fafd205e455']
                });
                printDevice.addEventListener('gattserverdisconnected', onDisconnected);
                await connectToPrinter();
            } catch (error) {
                console.error(error);
                alert('การเชื่อมต่อล้มเหลว: ' + error.message);
            }
        }

        async function connectToPrinter() {
            const server = await printDevice.gatt.connect();
            const services = await server.getPrimaryServices();
            for (const service of services) {
                const characteristics = await service.getCharacteristics();
                for (const char of characteristics) {
                    if (char.properties.write || char.properties.writeWithoutResponse) {
                        printCharacteristic = char;
                        const btn = document.getElementById('btn-bt-connect');
                        btn.innerText = '✅ เชื่อมต่อแล้ว (' + printDevice.name + ')';
                        btn.style.background = '#28a745';
                        return;
                    }
                }
            }
            throw new Error('ไม่พบช่องทางการพิมพ์บนอุปกรณ์นี้');
        }

        function onDisconnected() {
            console.warn('Bluetooth เข้าสู่โหมดสลีป');
            const btn = document.getElementById('btn-bt-connect');
            btn.innerText = '⚠️ พักการเชื่อมต่อ';
            btn.style.background = '#f39c12';
        }

        async function checkAndReconnectBluetooth() {
            if (!printDevice) {
                alert('กรุณากดปุ่ม 🔵 เชื่อมต่อเครื่องปริ้น ที่มุมขวาบนก่อนครับ');
                return false;
            }
            if (!printDevice.gatt.connected) {
                const btn = document.getElementById('btn-bt-connect');
                btn.innerText = '⏳ กำลังปลุกเครื่องปริ้น...';
                btn.style.background = '#007BFF';
                try {
                    await connectToPrinter();
                } catch (e) {
                    alert('เครื่องปริ้นหลุดการเชื่อมต่อ กรุณากดปุ่มเพื่อเชื่อมต่อใหม่ครับ');
                    btn.innerText = '🔴 ขาดการเชื่อมต่อ';
                    btn.style.background = '#dc3545';
                    return false;
                }
            }
            return true;
        }

        function convertCanvasToESCPOS(ctx, width, height, withCut = true) {
            const imgData = ctx.getImageData(0, 0, width, height).data;
            const xL = (width / 8) % 256;
            const xH = Math.floor((width / 8) / 256);
            const yL = height % 256;
            const yH = Math.floor(height / 256);
            let bytes = [0x1B, 0x40, 0x1D, 0x76, 0x30, 0x00, xL, xH, yL, yH];
            
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x += 8) {
                    let byte = 0;
                    for (let b = 0; b < 8; b++) {
                        if (x + b < width) {
                            const i = ((y * width) + (x + b)) * 4;
                            const brightness = (0.299 * imgData[i] + 0.587 * imgData[i+1] + 0.114 * imgData[i+2]);
                            if (imgData[i+3] > 128 && brightness < 128) byte |= (1 << (7 - b));
                        }
                    }
                    bytes.push(byte);
                }
            }
            bytes.push(0x0A, 0x0A, 0x0A, 0x0A); 
            if (withCut) { bytes.push(0x1D, 0x56, 0x41, 0x00); }
            return new Uint8Array(bytes);
        }

        // ==========================================
        // 1. ระบบปริ้นใบเสร็จ POS
        // ==========================================
        function loadImage(url) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = url;
            });
        }

        async function printReceiptBluetooth(type) {
            const isConnected = await checkAndReconnectBluetooth();
            if (!isConnected) return;

            const canvas = document.getElementById('receiptCanvas');
            canvas.height = 2000; 
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'black';
            
            let y = 40; 
            function drawText(text, x, align, font) {
                ctx.textAlign = align;
                ctx.font = font;
                ctx.fillText(text, x, y);
            }

            if (type === 'customer') {
                drawText('เติมมัทฉะ', 192, 'center', 'bold 35px sans-serif');
                y += 45;
                drawText('--------------------------------', 192, 'center', 'bold 24px sans-serif');
                y += 35;
                drawText(`ออเดอร์ #${currentOrderId}`, 10, 'left', 'bold 32px sans-serif');
                y += 40;
                
                const now = new Date();
                const day = String(now.getDate()).padStart(2, '0');
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const year = now.getFullYear() + 543;
                const hour = String(now.getHours()).padStart(2, '0');
                const minute = String(now.getMinutes()).padStart(2, '0');
                drawText(`วันที่ ${day}/${month}/${year} เวลา ${hour}:${minute} น.`, 192, 'center', '24px sans-serif');
                y += 35;
            } else {
                drawText(`ออเดอร์ที่ #${currentOrderId}`, 10, 'left', 'bold 32px sans-serif');
                y += 40;
                drawText('--------------------------------', 192, 'center', 'bold 24px sans-serif');
                y += 35;

                const now = new Date();
                const day = String(now.getDate()).padStart(2, '0');
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const year = now.getFullYear() + 543;
                const hour = String(now.getHours()).padStart(2, '0');
                const minute = String(now.getMinutes()).padStart(2, '0');
                drawText(`วันที่ ${day}/${month}/${year} เวลา ${hour}:${minute} น.`, 192, 'center', '24px sans-serif');
                y += 35;
            }

            drawText('รายการ', 10, 'left', 'bold 24px sans-serif');
            drawText('ราคา', 374, 'right', 'bold 24px sans-serif'); 
            y += 40;

            function drawItemLine(nameText, priceText, nameX, priceX, yPos, maxWidth, font, isAddon = false) {
                ctx.font = font;
                if (priceText) {
                    ctx.textAlign = 'right';
                    ctx.fillText(priceText, priceX, yPos);
                }
                ctx.textAlign = 'left';
                let line = '';
                let chars = [];
                if (typeof Intl.Segmenter !== 'undefined') {
                    const segmenter = new Intl.Segmenter('th-TH', { granularity: 'grapheme' });
                    chars = [...segmenter.segment(nameText)].map(s => s.segment);
                } else {
                    chars = nameText.split('');
                }
                for (let i = 0; i < chars.length; i++) {
                    let testLine = line + chars[i];
                    let metrics = ctx.measureText(testLine);
                    if (metrics.width > maxWidth && i > 0) {
                        ctx.fillText(line, nameX, yPos);
                        line = chars[i];
                        yPos += (isAddon ? 32 : 35);
                    } else {
                        line = testLine;
                    }
                }
                ctx.fillText(line, nameX, yPos);
                return yPos + (isAddon ? 32 : 35); 
            }

            let total = 0, discount = 0;
            let printCart = {};
            cart.forEach(item => {
                let itemTotal = item.price;
                let addons = [];
                item.selectedAddons.forEach(a => {
                    itemTotal += a.price;
                    addons.push(a.name);
                });
                if(item.isFree) discount += itemTotal; else total += itemTotal;
                let key = item.name + addons.join('') + (item.isFree ? 'FREE' : '');
                if(!printCart[key]) {
                    printCart[key] = { name: item.name, qty: 0, price: item.isFree ? 0 : itemTotal, addons: addons, isFree: item.isFree };
                }
                printCart[key].qty++;
            });

            for(let key in printCart) {
                const item = printCart[key];
                const itemNameStr = `x${item.qty} ${item.name}` + (item.isFree ? ' (ฟรี)' : '');
                const priceStr = `${item.price * item.qty}฿`;
                y = drawItemLine(itemNameStr, priceStr, 10, 374, y, 260, 'bold 26px sans-serif', false);
                item.addons.forEach(addon => {
                    y = drawItemLine(`+ ${addon}`, "", 35, 374, y, 320, '24px sans-serif', true);
                });
            }

            y += 10;
            drawText('--------------------------------', 192, 'center', 'bold 24px sans-serif');
            y += 40;
            drawText('ส่วนลด', 10, 'left', '26px sans-serif');
            drawText(`${discount}฿`, 374, 'right', '26px sans-serif');
            y += 40;
            drawText('รวม', 10, 'left', 'bold 30px sans-serif');
            drawText(`${total}฿`, 374, 'right', 'bold 30px sans-serif');
            y += 50;

            if (type === 'customer') {
                drawText('ขอบคุณลูกค้าทุกท่านนะคะ', 192, 'center', '26px sans-serif');
                y += 35;
                drawText('Tel : 083-117-8690', 192, 'center', '26px sans-serif');
                y += 60;
            } else { y += 40; }

            try {
                if (type === 'shop') saveOrderAndFinish();

                const loadingToast = showToast("กำลังปริ้นใบเสร็จ...");
                const shouldCut = (type === 'shop'); 
                const escposData = convertCanvasToESCPOS(ctx, 384, y, shouldCut);
                
                const CHUNK_SIZE = 512;
                for (let i = 0; i < escposData.length; i += CHUNK_SIZE) {
                    await printCharacteristic.writeValue(escposData.slice(i, i + CHUNK_SIZE));
                }
                loadingToast.remove();
            } catch (e) {
                showToast("ปริ้นล้มเหลว", 'error');
            }
        }

        // ==========================================
        // 2. ระบบปริ้นโค้ดสะสมแต้ม (Supabase)
        // ==========================================
        function generatePointButtons() {
            const grid = document.getElementById('point-button-grid');
            if(grid) grid.innerHTML = '';
            
            const paymentGrid = document.getElementById('payment-point-grid');
            if (paymentGrid) {
                const titleElement = paymentGrid.querySelector('.payment-point-title');
                paymentGrid.innerHTML = '';
                if(titleElement) paymentGrid.appendChild(titleElement);
            }

            for (let i = 1; i <= 10; i++) {
                if(grid) {
                    let btn = document.createElement('button');
                    btn.className = 'cup-btn';
                    btn.innerText = i + ' แก้ว';
                    btn.onclick = () => requestPointPrint(i);
                    grid.appendChild(btn);
                }
                if(paymentGrid) {
                    let quickBtn = document.createElement('button');
                    quickBtn.className = 'payment-point-btn';
                    quickBtn.innerText = i;
                    quickBtn.onclick = () => requestPointPrint(i);
                    paymentGrid.appendChild(quickBtn);
                }
            }
        }

        async function requestPointPrint(cups) {
            const isConnected = await checkAndReconnectBluetooth();
            if (!isConnected) return;

            const loadingToast = showToast(`กำลังตรวจสอบและสร้างโค้ด ${cups} แก้ว... 🍵`);
            
            function generateRandomString(length) {
                const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
                let result = '';
                for (let i = 0; i < length; i++) {
                    result += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                return result;
            }

            const expDate = new Date();
            expDate.setDate(expDate.getDate() + 30);
            const dd = ("0" + expDate.getDate()).slice(-2);
            const mm = ("0" + (expDate.getMonth() + 1)).slice(-2); 
            const yyyy = expDate.getFullYear();
            const expiryDate = `${dd}/${mm}/${yyyy}`;

            let isSaved = false;
            let finalCode = "";

            try {
                let attempts = 0;
                while (!isSaved && attempts < 5) {
                    attempts++;
                    const random10 = generateRandomString(10);
                    const cupsStr = ("0" + cups).slice(-2);
                    const code = `${random10}${cupsStr}`;
                    
                    const payload = { code: code, cups: cups, expiry_date: expiryDate };

                    const response = await fetch(`${SUPABASE_URL}/rest/v1/point_codes`, {
                        method: 'POST',
                        headers: {
                            'apikey': SUPABASE_KEY,
                            'Authorization': `Bearer ${SUPABASE_KEY}`,
                            'Content-Type': 'application/json',
                            'Prefer': 'return=minimal' 
                        },
                        body: JSON.stringify(payload)
                    });

                    if (response.ok) {
                        isSaved = true;
                        finalCode = code;
                    } else if (response.status === 409) {
                        console.warn(`โค้ดซ้ำ กำลังสุ่มใหม่...`);
                    } else {
                        throw new Error(`Supabase Error: ${response.status}`);
                    }
                }

                if (isSaved) {
                    loadingToast.innerText = `สร้างโค้ดสำเร็จ กำลังปริ้น... 🖨️`;
                    handlePointPrint({ code: finalCode, cups: cups, expiryDate: expiryDate }, loadingToast);
                } else {
                    throw new Error("ไม่สามารถสร้างรหัสที่ไม่ซ้ำได้");
                }
            } catch (error) {
                loadingToast.remove();
                showToast(`ล้มเหลว: ${error.message}`, 'error');
            }
        }

        async function handlePointPrint(data, loadingToast) {
            try {
                const canvas = document.getElementById('receiptCanvas');
                canvas.height = 800; 
                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                ctx.fillStyle = 'white';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'black';
                ctx.textAlign = 'center';
                
                let y = 40;
                ctx.font = 'bold 24px sans-serif';
                ctx.fillText('สมัครสมาชิก LINE เติมมัทฉะ', 192, y);
                y += 30;

                const qrLine = new QRious({ value: 'https://lin.ee/qcDHIwx', size: 150 });
                ctx.drawImage(qrLine.canvas, 192 - 75, y, 150, 150);
                y += 180;

                ctx.font = '22px sans-serif';
                ctx.fillText('สแกน หรือ กรอกโค้ดเพื่อสะสมแต้ม', 192, y);
                y += 40;

                ctx.font = 'bold 28px sans-serif';
                ctx.fillText('จำนวน ' + data.cups + ' แก้ว', 192, y);
                y += 30;

                const qrCode = new QRious({ value: String(data.code), size: 200 });
                ctx.drawImage(qrCode.canvas, 192 - 100, y, 200, 200);
                y += 230; 
                
                ctx.font = 'bold 28px sans-serif';
                ctx.fillText(data.code || "ไม่พบโค้ด", 192, y);
                y += 35;
                
                ctx.font = '20px sans-serif';
                ctx.fillText('โค้ดสะสมแต้มมีอายุ 30 วัน', 192, y);
                y += 30;
                ctx.fillText('(หมดอายุ ' + data.expiryDate + ')', 192, y);
                
                y += 50; 
                ctx.fillText('------------------------------', 192, y);

                const escposData = convertCanvasToESCPOS(ctx, 384, y + 20, true); 
                const CHUNK_SIZE = 512;
                for (let i = 0; i < escposData.length; i += CHUNK_SIZE) {
                    await printCharacteristic.writeValue(escposData.slice(i, i + CHUNK_SIZE));
                }
                
                loadingToast.className = 'toast success';
                loadingToast.innerText = `ปริ้นโค้ดแต้ม ${data.cups} แก้ว เสร็จสิ้น ✅`;
                setTimeout(() => loadingToast.remove(), 3000);
            } catch (e) {
                loadingToast.remove();
                showToast(`ปริ้นแต้มล้มเหลว: ${e.message}`, 'error');
            } 
        }

        // ==========================================
        // 3. UI และ ฟังก์ชัน POS 
        // ==========================================
        function renderAllMenus() {
            const container = document.getElementById('menu-list-container');
            container.innerHTML = '';
            const cats = [...new Set(appData.menus.map(m => m.category))];

            cats.forEach((cat, index) => {
                const section = document.createElement('div');
                section.className = 'category-section' + (index === 0 ? '' : ' collapsed');
                
                const header = document.createElement('div');
                header.className = 'category-title';
                header.innerText = cat;
                header.onclick = () => { section.classList.toggle('collapsed'); };
                
                const content = document.createElement('div');
                content.className = 'category-content';
                
                const grid = document.createElement('div');
                grid.className = 'menu-grid';

                const items = appData.menus.filter(m => m.category === cat);
                items.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'menu-item';
                    div.innerHTML = `<div class="menu-name">${item.name}</div><div class="menu-price">${item.price}฿</div>`;
                    div.onclick = () => selectItem(item);
                    grid.appendChild(div);
                });

                content.appendChild(grid);
                section.appendChild(header);
                section.appendChild(content);
                container.appendChild(section);
            });
        }

        function selectItem(item) {
            if (item.addonId && item.addonId.length > 0) {
                tempItem = { ...item, selectedAddons: [] };
                openAddonModal(item);
            } else {
                addToCart({ ...item, selectedAddons: [], cartId: Date.now() });
            }
        }

        function openAddonModal(item) {
            document.getElementById('addon-modal-title').innerText = item.name;
            const body = document.getElementById('addon-modal-body');
            body.innerHTML = '';
            
            item.addonId.forEach((aId, index) => {
                const addon = appData.addons[aId];
                if (addon) {
                    const group = document.createElement('div');
                    group.className = 'addon-group' + (index === 0 ? '' : ' collapsed');
                    
                    const header = document.createElement('div');
                    header.className = 'addon-group-header';
                    header.innerText = addon.name;
                    header.onclick = () => group.classList.toggle('collapsed');
                    
                    const content = document.createElement('div');
                    content.className = 'addon-group-content';
                    
                    addon.options.forEach(opt => {
                        const optLabel = document.createElement('label');
                        optLabel.className = 'addon-option';
                        optLabel.innerHTML = `
                            <div style="display: flex; align-items: center;">
                                <input type="checkbox" value='${JSON.stringify(opt)}' class="addon-chk">
                                <span>${opt.name}</span>
                            </div>
                            <span style="color: var(--secondary);">+${opt.price}฿</span>
                        `;
                        content.appendChild(optLabel);
                    });
                    
                    group.appendChild(header);
                    group.appendChild(content);
                    body.appendChild(group);
                }
            });
            document.getElementById('addon-modal').style.display = 'flex';
        }

        function confirmAddon() {
            const checkboxes = document.querySelectorAll('.addon-chk:checked');
            checkboxes.forEach(chk => { tempItem.selectedAddons.push(JSON.parse(chk.value)); });
            tempItem.cartId = Date.now();
            addToCart(tempItem);
            closeModal('addon-modal');
        }

        function addToCart(item) {
            item.isFree = false;
            cart.push(item);
            renderCart();
        }

        function renderCart() {
            const list = document.getElementById('cart-list');
            list.innerHTML = '';
            let total = 0, discount = 0;

            cart.forEach((item, index) => {
                let itemTotal = item.price;
                let addonText = '';
                if(item.selectedAddons){
                    item.selectedAddons.forEach(a => {
                        itemTotal += a.price;
                        addonText += `+ ${a.name} `;
                    });
                }
                if(item.isFree) discount += itemTotal; else total += itemTotal;

                list.innerHTML += `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <div>${item.name} ${item.isFree ? '<span style="color:#E63946">(ฟรี)</span>' : ''}</div>
                            <div class="cart-addon">${addonText}</div>
                        </div>
                        <div class="cart-item-price-col">
                            <div>${item.isFree ? '0' : itemTotal}฿</div>
                            <button class="btn-delete" onclick="cart.splice(${index}, 1); renderCart();">ลบ</button>
                        </div>
                    </div>
                `;
            });

            document.getElementById('discount-display').innerText = discount + '฿';
            document.getElementById('total-display').innerText = total + '฿';
            updateCustomerDisplay(total, discount);
            list.scrollTop = list.scrollHeight;
        }

        function openFreeCupModal() {
            if(cart.length === 0) return alert('กรุณาเลือกสินค้าก่อน');
            const body = document.getElementById('free-modal-body');
            body.innerHTML = '';
            cart.forEach((item, i) => {
                body.innerHTML += `
                    <div class="addon-option" onclick="const chk=document.getElementById('free-chk-${i}'); chk.checked=!chk.checked;">
                        <label onclick="event.preventDefault()">
                            <input type="checkbox" id="free-chk-${i}" ${item.isFree ? 'checked' : ''} onclick="event.stopPropagation()"> 
                            <span>${item.name}</span>
                        </label>
                    </div>
                `;
            });
            document.getElementById('free-modal').style.display = 'flex';
        }

        function confirmFree() {
            cart.forEach((item, i) => { item.isFree = document.getElementById(`free-chk-${i}`).checked; });
            renderCart();
            closeModal('free-modal');
            openPaymentModal();
        }

        function skipFree() {
            cart.forEach(item => item.isFree = false);
            renderCart();
            closeModal('free-modal');
            openPaymentModal();
        }

        function openPaymentModal() {
            document.getElementById('pay-amount').innerText = document.getElementById('total-display').innerText;
            document.getElementById('print-controls').style.display = 'none';
            document.getElementById('payment-modal').style.display = 'flex';
            
            let state = JSON.parse(localStorage.getItem('pos_state')) || { cart:[], total:0, discount:0 };
            state.showQR = false;
            localStorage.setItem('pos_state', JSON.stringify(state));
        }

        function closePaymentModal() {
            document.getElementById('payment-modal').style.display = 'none';
            document.getElementById('print-controls').style.display = 'none';
            currentPaymentMethod = '';
            
            let state = JSON.parse(localStorage.getItem('pos_state')) || { cart:[], total:0, discount:0 };
            state.showQR = false;
            localStorage.setItem('pos_state', JSON.stringify(state));
        }

        function processPayment(method) {
            currentPaymentMethod = method;
            document.getElementById('print-controls').style.display = 'block';
            
            if (method === 'QRCODE') {
                let state = JSON.parse(localStorage.getItem('pos_state'));
                state.showQR = true;
                localStorage.setItem('pos_state', JSON.stringify(state));
            }
        }

        async function saveOrderAndFinish() {
            let total = 0;
            cart.forEach(item => {
                let itemTotal = item.price;
                item.selectedAddons.forEach(a => itemTotal += a.price);
                if(!item.isFree) total += itemTotal;
            });

            const savedOrderId = currentOrderId;
            const d = new Date();
            const dateStr = `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;

            const payload = { 
                order_id: savedOrderId, 
                date_str: dateStr, 
                total: total, 
                payment_method: currentPaymentMethod 
            };

            currentOrderId++;
            cart = [];
            renderCart();
            closePaymentModal();

            const loadingToast = showToast(`กำลังบันทึกออเดอร์ #${savedOrderId}...`);

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/pos_orders`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify(payload)
                });
                
                if (!response.ok) throw new Error('Network Error');

                loadingToast.className = 'toast success';
                loadingToast.innerText = `บันทึกออเดอร์ #${savedOrderId} สำเร็จ ✅`;
                setTimeout(() => { if(loadingToast.parentElement) loadingToast.remove(); }, 3000);
            } catch (err) {
                loadingToast.remove();
                showToast(`บันทึกออเดอร์ #${savedOrderId} ล้มเหลว!`, 'error');
            }
        }

        // ==========================================
        // ระบบพักบิล
        // ==========================================
        function holdOrder() {
            if (cart.length === 0) return alert('ไม่มีรายการในตะกร้า');
            const holdTime = new Date();
            const timeStr = String(holdTime.getHours()).padStart(2, '0') + ':' + String(holdTime.getMinutes()).padStart(2, '0');
            
            let summary = cart.map(item => item.name).join(', ');
            if(summary.length > 35) summary = summary.substring(0, 35) + '...';

            heldOrders.push({ time: timeStr, cart: JSON.parse(JSON.stringify(cart)), summary: summary, totalItems: cart.length });
            saveHeldOrders();
            cart = [];
            renderCart();
            showToast('พักบิลเรียบร้อยแล้ว เตรียมรับออเดอร์ใหม่ได้เลย', 'success');
        }

        function saveHeldOrders() {
            localStorage.setItem('heldOrders', JSON.stringify(heldOrders));
            updateHeldOrdersCount();
        }

        function updateHeldOrdersCount() {
            document.getElementById('held-count').innerText = `(${heldOrders.length})`;
        }

        function openHeldOrdersModal() {
            renderHeldOrdersList();
            document.getElementById('held-orders-modal').style.display = 'flex';
        }

        function renderHeldOrdersList() {
            const list = document.getElementById('held-orders-list');
            list.innerHTML = '';
            if (heldOrders.length === 0) {
                list.innerHTML = '<div style="text-align:center; color:#aaa; padding: 20px;">ไม่มีบิลที่ถูกพักไว้</div>';
                return;
            }

            heldOrders.forEach((order, index) => {
                list.innerHTML += `
                    <div class="held-order-item">
                        <div class="held-order-info">
                            <div style="font-weight: bold; color: var(--secondary);">เวลาพักบิล: ${order.time}</div>
                            <div style="font-size: 0.9em; color: #bbb; margin-top: 5px;">${order.totalItems} แก้ว | ${order.summary}</div>
                        </div>
                        <div class="held-order-actions">
                            <button class="btn-secondary" style="padding: 8px 12px; font-size: 1em; margin:0;" onclick="resumeOrder(${index})">เรียกคืน</button>
                            <button class="btn-delete" style="padding: 8px 12px; font-size: 1em; margin: 0;" onclick="deleteHeldOrder(${index})">ลบ</button>
                        </div>
                    </div>
                `;
            });
        }

        function resumeOrder(index) {
            if (cart.length > 0) {
                const confirmHold = confirm("ตะกร้าปัจจุบันมีสินค้าอยู่ ต้องการพักบิลปัจจุบันก่อนเรียกคืนหรือไม่?\n(กด OK เพื่อพักบิลปัจจุบัน | กด Cancel เพื่อเขียนทับ)");
                if (confirmHold) holdOrder();
            }
            cart = heldOrders[index].cart;
            heldOrders.splice(index, 1);
            saveHeldOrders();
            renderCart();
            closeModal('held-orders-modal');
            showToast('เรียกคืนบิลสำเร็จ พร้อมชำระเงิน', 'success');
        }

        function deleteHeldOrder(index) {
            if (confirm("ต้องการลบใบบิลที่พักไว้นี้ทิ้งใช่หรือไม่?")) {
                heldOrders.splice(index, 1);
                saveHeldOrders();
                renderHeldOrdersList();
            }
        }

        function updateCustomerDisplay(total = 0, discount = 0) {
            const state = { cart, total, discount, showQR: false };
            localStorage.setItem('pos_state', JSON.stringify(state));
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    </script>
</body>
