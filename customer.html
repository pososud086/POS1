<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Facing Display</title>
    <style>
        :root { --bg: #0a0a0a; --surface: #1a1a1a; --primary: #E63946; --secondary: #F4A261; --text: #ffffff; }
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
        
        .left-panel { flex: 4; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 40px; background: var(--surface); border-right: 2px solid #333; }
        .logo { max-width: 80%; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .qr-container { display: none; text-align: center; animation: fadeIn 0.5s ease-in-out; }
        .qr-container img { max-width: 250px; background: white; padding: 10px; border-radius: 10px; }
        .qr-container h2 { color: var(--secondary); margin-top: 15px; }

        .right-panel { flex: 6; display: flex; flex-direction: column; padding: 40px; }
        .cart-header { font-size: 2.5em; margin-bottom: 20px; border-bottom: 3px solid #333; padding-bottom: 10px;   display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: bold;}

        
        .cart-list { flex: 1; overflow-y: auto; font-weight: bold;}
        .cart-item { display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #333; font-size: 1.5em; animation: slideIn 0.3s ease-out; }
        .cart-addon { font-size: 0.6em; color: #aaa; margin-top: 5px; }
        
        .summary-box { background: var(--surface); padding: 30px; border-radius: 15px; margin-top: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .summary-line { display: flex; justify-content: space-between; font-size: 1.8em; margin-bottom: 15px; color: #ccc; }
        .total-line { display: flex; justify-content: space-between; font-size: 3.5em; font-weight: bold; color: var(--secondary); border-top: 2px dashed #444; padding-top: 20px; }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body>

    <div class="left-panel">
        <img src="https://img2.pic.in.th/-14bef4c1d6171bace.gif" class="logo" alt="Logo">
        <div class="qr-container" id="qr-container">
            <img id="qr-image" src="" alt="QR Code">
            <h2>สแกนเพื่อชำระเงิน</h2>
        </div>
    </div>

    <div class="right-panel">
        <div class="cart-header">
  <span>รายการ Order</span>
  <span>ราคา</span>
</div>
        <div class="cart-list" id="cart-list"></div>
        <div class="summary-box">
            <div class="summary-line"><span>ส่วนลด (Discount)</span><span id="discount-val">0฿</span></div>
            <div class="total-line"><span>รวม (Total)</span><span id="total-val">0฿</span></div>
        </div>
    </div>

    <script>
        // เบอร์พร้อมเพย์ของคุณ
        const PROMPTPAY_PHONE = '0831178690';

        function updateUI() {
            const stateStr = localStorage.getItem('pos_state');
            if (!stateStr) return;
            const state = JSON.parse(stateStr);
            
            // Render Cart
            const list = document.getElementById('cart-list');
            list.innerHTML = '';
            
            // Group เหมือนตอนปริ้น
            let printCart = {};
            state.cart.forEach(item => {
                let itemTotal = item.price;
                let addonText = '';
                item.selectedAddons.forEach(a => {
                    itemTotal += a.price;
                    addonText += `+ ${a.name} `;
                });
                
                let key = item.name + addonText + (item.isFree ? 'FREE' : '');
                if(!printCart[key]) {
                    printCart[key] = { 
                        name: item.name + (item.isFree ? ' <span style="color:var(--primary)">(ฟรี)</span>' : ''), 
                        qty: 0, 
                        price: item.isFree ? 0 : itemTotal,
                        addon: addonText
                    };
                }
                printCart[key].qty++;
            });

            for(let key in printCart) {
                list.innerHTML += `
                    <div class="cart-item">
                        <div>
                            ${printCart[key].qty}x ${printCart[key].name}
                            <div class="cart-addon">${printCart[key].addon}</div>
                        </div>
                        <div>${printCart[key].price * printCart[key].qty}฿</div>
                    </div>
                `;
            }

            // Update Totals
            document.getElementById('discount-val').innerText = state.discount + '฿';
            document.getElementById('total-val').innerText = state.total + '฿';

            // Show/Hide QR
            const qrContainer = document.getElementById('qr-container');
            if (state.showQR && state.total > 0) {
                // ใช้ API สร้าง QR PromptPay
                document.getElementById('qr-image').src = `https://promptpay.io/${PROMPTPAY_PHONE}/${state.total}.png`;
                qrContainer.style.display = 'block';
            } else {
                qrContainer.style.display = 'none';
            }
        }

        // ฟังการเปลี่ยนแปลงของ localStorage จากหน้าจอหลัก
        window.addEventListener('storage', updateUI);
        
        // อัปเดตครั้งแรกตอนเปิดหน้า
        updateUI();
    </script>
</body>
</html>
