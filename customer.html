<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Facing Display (CFD)</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1E1E1E;
      --primary-red: #D32F2F;
      --primary-orange: #F57C00;
    }
    * { box-sizing: border-box; font-family: 'Kanit', sans-serif; margin: 0; padding: 0; }
    body { background: var(--bg-color); color: white; height: 100vh; display: flex; padding: 20px; gap: 20px; }

    .order-summary-panel { flex: 6; background: var(--card-bg); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
    .display-title { font-size: 1.8rem; font-weight: 700; color: var(--primary-orange); border-bottom: 2px solid var(--primary-red); padding-bottom: 10px; }
    .item-list { flex: 1; margin: 20px 0; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .cfd-item { display: flex; justify-content: space-between; font-size: 1.3rem; background: #2A2A2A; padding: 12px; border-radius: 10px; }

    .qr-panel { flex: 4; background: #181818; border: 2px solid var(--primary-orange); border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
    .qr-img { width: 250px; height: 250px; background: white; margin-top: 15px; padding: 10px; border-radius: 12px; }
  </style>
</head>
<body>

  <div class="order-summary-panel">
    <div class="display-title">🍵 รายการสั่งซื้อของคุณ</div>
    <div class="item-list" id="cfd-items">
      <div style="text-align:center; color:#888; font-size:1.4rem; margin-top:50px;">ยินดีต้อนรับสู่ร้านเติมมัทฉะ</div>
    </div>
    <div style="border-top:1px solid #444; padding-top:15px;">
      <div style="display:flex; justify-content:space-between; font-size:1.5rem;"><span>ยอดรวม:</span><span id="cfd-subtotal">฿0</span></div>
      <div style="display:flex; justify-content:space-between; font-size:1.5rem; color:var(--primary-red);"><span>ส่วนลด:</span><span id="cfd-discount">-฿0</span></div>
      <div style="display:flex; justify-content:space-between; font-size:2.2rem; font-weight:700; color:var(--primary-orange);"><span>ยอดชำระสุทธิ:</span><span id="cfd-total">฿0</span></div>
    </div>
  </div>

  <div class="qr-panel" id="qr-panel">
    <div style="font-size:1.6rem; font-weight:700; color:var(--primary-orange);">สแกนชำระเงิน QR-CODE</div>
    <img id="qr-image" class="qr-img" src="https://via.placeholder.com/250?text=Scan+QR+Payment" alt="QR Code">
    <div style="margin-top:15px; font-size:1.1rem; color:#aaa;">กรุณาสแกนเพื่อชำระเงิน</div>
  </div>

  <script>
    // ดักฟังการอัปเดตข้อมูลจากหน้าหลัก POS ผ่าน localStorage Event แบบ Real-time
    window.addEventListener('storage', (event) => {
      if (event.key === 'pos_cfd_event' && event.newValue) {
        const data = JSON.parse(event.newValue);
        renderCFD(data);
      }
    });

    function renderCFD(data) {
      const container = document.getElementById('cfd-items');
      container.innerHTML = data.cart.map(item => `
        <div class="cfd-item">
          <div>${item.name} ${item.isFreeGlass ? '<span style="color:red;">(แถมฟรี)</span>' : ''}</div>
          <div>฿${item.isFreeGlass ? 0 : item.price}</div>
        </div>
      `).join('');

      document.getElementById('cfd-subtotal').innerText = `฿${data.subtotal}`;
      document.getElementById('cfd-discount').innerText = `-฿${data.discount}`;
      document.getElementById('cfd-total').innerText = `฿${data.total}`;
    }
  </script>
</body>
</html>
