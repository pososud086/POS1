
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Display</title>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background-color: #121212; color: #fff; display: flex; height: 100vh; overflow: hidden; }
        .left-panel { width: 50%; padding: 20px; background: #1E1E1E; border-right: 4px solid #D32F2F; overflow-y: auto; }
        .right-panel { width: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #121212; }
        h1 { color: #F57C00; font-size: 3em; margin-bottom: 10px; }
        .cart-item { display: flex; justify-content: space-between; font-size: 1.8em; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .total-price { font-size: 5em; color: #D32F2F; font-weight: bold; margin-top: 20px; }
        #qr-container { background: #fff; padding: 20px; border-radius: 10px; display: none; margin-top: 20px; }
        .qr-placeholder { width: 300px; height: 300px; background: #eee; display: flex; align-items: center; justify-content: center; color: #000; font-size: 20px; }
    </style>
</head>
<body>
    <div class="left-panel">
        <h1>รายการสั่งซื้อ</h1>
        <div id="c-cart"></div>
    </div>
    <div class="right-panel">
        <h1 style="color:#fff;">ยอดรวมทั้งสิ้น</h1>
        <div class="total-price" id="c-total">0 บาท</div>
        <div id="qr-container">
            <div id="qrcode" class="qr-placeholder">📱 สแกนเพื่อจ่ายเงิน</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        window.addEventListener('storage', (e) => {
            if(e.key === 'cfd_state') {
                const state = JSON.parse(e.newValue);
                renderCart(state.cart, state.total);
                if(state.payment === 'QR-CODE') {
                    document.getElementById('qr-container').style.display = 'block';
                    document.getElementById('qrcode').innerHTML = "";
                    new QRCode(document.getElementById('qrcode'), {
                        text: "PROMPTPAY-OR-PAYMENT-DATA-HERE",
                        width: 300, height: 300
                    });
                } else {
                    document.getElementById('qr-container').style.display = 'none';
                }
            }
        });

        function renderCart(cart, total) {
            let html = '';
            cart.forEach(c => {
                let p = c.isFree ? "ฟรี" : c.price * c.qty + "฿";
                html += `<div class="cart-item">
                            <span>${c.qty}x ${c.name}</span>
                            <span style="${c.isFree ? 'color:#4CAF50' : ''}">${p}</span>
                         </div>`;
            });
            document.getElementById('c-cart').innerHTML = html;
            document.getElementById('c-total').innerText = total + " บาท";
        }
        
        // Initial load
        const init = localStorage.getItem('cfd_state');
        if(init) {
            const state = JSON.parse(init);
            renderCart(state.cart, state.total);
        }
    </script>
</body>
</html>
