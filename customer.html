<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>หน้าจอลูกค้า</title>
  <style>
    body {
      background-color: #121212; color: #fff; font-family: 'Sarabun', sans-serif;
      margin: 0; display: flex; height: 100vh;
    }
    .media-section { flex: 2; background: url('https://images.unsplash.com/photo-1515823662972-da6a2b4d3002?auto=format&fit=crop&q=80') center/cover; }
    .order-section { flex: 1; background: #1e1e1e; padding: 40px; display: flex; flex-direction: column; border-left: 5px solid #ff6d00; }
    
    h1 { text-align: center; color: #ff6d00; font-size: 36px; margin-top: 0; }
    .list { flex: 1; overflow-y: auto; font-size: 24px; }
    .item { display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px dashed #444; }
    
    .summary { margin-top: 20px; padding-top: 20px; border-top: 2px solid #555; }
    .row { display: flex; justify-content: space-between; font-size: 28px; margin-bottom: 15px; }
    .total { font-size: 40px; font-weight: bold; color: #ff6d00; }
    .discount { color: #4caf50; }
  </style>
</head>
<body>

  <div class="media-section">
    <!-- ใส่สไลด์โชว์โปรโมชั่นร้านได้ตรงนี้ -->
  </div>

  <div class="order-section">
    <h1>รายการสั่งซื้อของคุณ</h1>
    <div class="list" id="cdsList"></div>
    
    <div class="summary">
      <div class="row discount" id="cdsDiscountRow" style="display:none;">
        <span>ส่วนลด (แก้วฟรี)</span><span id="cdsDiscount">-฿0</span>
      </div>
      <div class="row total">
        <span>ยอดชำระ</span><span id="cdsTotal">฿0</span>
      </div>
    </div>
  </div>

  <script>
    function updateDisplay(data) {
      if (!data) return;
      
      const list = document.getElementById('cdsList');
      list.innerHTML = data.cart.map(item => `
        <div class="item">
          <span>${item.Name}</span>
          <span>฿${item.Price}</span>
        </div>
      `).join('');

      document.getElementById('cdsTotal').innerText = '฿' + (data.total - data.discount);
      
      const discountRow = document.getElementById('cdsDiscountRow');
      if(data.discount > 0) {
        discountRow.style.display = 'flex';
        document.getElementById('cdsDiscount').innerText = '-฿' + data.discount;
      } else {
        discountRow.style.display = 'none';
      }
    }

    // โหลดข้อมูลล่าสุด
    updateDisplay(JSON.parse(localStorage.getItem('cds_data')));

    // ดักจับการเปลี่ยนแปลงจากหน้า index.html ทันที
    window.addEventListener('storage', (e) => {
      if(e.key === 'cds_data') {
        updateDisplay(JSON.parse(e.newValue));
      }
    });
  </script>
</body>
</html>
