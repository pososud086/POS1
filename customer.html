<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Customer Display</title>
  <style>
    body {
      background-color: #121212;
      color: #FFFFFF;
      font-family: 'Kanit', sans-serif;
      display: flex;
      height: 100vh;
      margin: 0;
    }
    .left-side { flex: 1; padding: 30px; border-right: 2px solid #D32F2F; }
    .right-side { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #1e1e1e; }
    .total-price { font-size: 3rem; color: #F57C00; }
  </style>
</head>
<body>
  <div class="left-side">
    <h2>รายการเครื่องดื่มของคุณ</h2>
    <div id="display-items"></div>
  </div>
  <div class="right-side">
    <div class="total-price">ราคารวม: <span id="display-total">0</span> ฿</div>
    <div id="qr-container" style="margin-top:20px;"></div>
  </div>

  <script>
    // ฟัง Event จากหน้าจอหลัก POS ผ่าน LocalStorage [2]
    window.addEventListener('storage', (e) => {
      if (e.key === 'pos_cart_update') {
        const data = JSON.parse(e.newValue);
        const container = document.getElementById('display-items');
        container.innerHTML = '';
        data.cart.forEach(item => {
          container.innerHTML += `<p style="font-size:1.5rem;">${item.name} - ${item.price} บาท</p>`;
        });
        document.getElementById('display-total').innerText = data.total;
      }
      
      if (e.key === 'pos_payment_qr') {
        const qrData = JSON.parse(e.newValue);
        document.getElementById('qr-container').innerHTML = `
          <img src="${qrData.qrUrl}" alt="Scan QR" style="width:280px; height:280px; border:4px solid #F57C00; border-radius:12px;">
          <h3 style="color:#D32F2F; text-align:center;">สแกนจ่ายชำระเงิน</h3>
        `;
      }
    });
  </script>
</body>
</html>
